name: Generate and Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'src/sihpy/**/*.py'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allows only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Install Poetry
        run: pipx install poetry
  
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'poetry'
  
      - name: Install dependencies
        run: poetry install --all-groups
  
      - name: Generate pdoc3 documentation
        run: |
          poetry run pdoc3 --html --output-dir docs src/mycoloc
          
          # Move files to root so GitHub Pages serves them at the base URL
          mv docs/sihpy/* docs/
          rm -r docs/mycoloc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
