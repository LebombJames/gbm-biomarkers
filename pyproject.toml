[project]
name = "mycoloc"
version = "0.0.1"
description = "A general-purpose package for performing histology to MRI coregistration"
authors = [{ name = "Sam Marine", email = "sam.marine418@gmail.com" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "antspyx (>=0.6.3,<0.7.0)",
    "numpy (==2.2.6)",
    "matplotlib (==3.10.9)",
    "pillow (>=12.3.0,<13.0.0)",
    "pydicom (>=3.0.2,<4.0.0)",
    "scipy (==1.15.3)",
    "simpleitk (>=2.5.5,<3.0.0)",
    "scikit-image (==0.25.2)",
    "tiffslide (==2.5.1)",
    "typing-extensions (>=4.16.0,<5.0.0)",
]
dynamic = ["classifiers"]

[project.urls]
Homepage = "https://github.com/LebombJames/gbm-biomarkers"
Issues = "https://github.com/LebombJames/gbm-biomarkers/issues"

[tools.poetry]
classifiers = ["Operating System :: OS Independent"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
docs = [
    "pdoc3 (>=0.11.6,<0.12.0)"
]
